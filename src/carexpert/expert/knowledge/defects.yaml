  years: [2008, 2016]
  titre: "DSG 7 a sec (DQ200) - mecatronique"
  symptomes: "A-coups a basse vitesse, refus d'engager un rapport, voyant boite."
  verifier: "Passage des rapports a froid en manoeuvre, vidange boite effectuee, mecatronique remplacee."
  cout_eur: 2000
  severite: 4

