# Base de connaissances: faiblesses connues par motorisation / modele.
#
# Sert a deux choses: orienter le regard de l'expert (Claude) vers ce qui
# compte sur CE vehicule, et chiffrer le risque quand l'annonce reste muette.
#
# Chaque entree est une tendance documentee, pas une fatalite: un exemplaire
# suivi peut etre sain. Le champ `verifier` est ce qu'il faut demander ou
# controler avant d'acheter.
#
# severite: 1 (agacant) a 5 (redhibitoire si non traite)

- code: psa_puretech_courroie_humide
  makes: [Peugeot, Citroen, DS, Opel]
  keywords: ["puretech", "1.2 puretech", "eb2dts", "130 puretech", "110 puretech"]
  years: [2013, 2022]
  titre: "PureTech 1.2 - courroie de distribution immergee"
  symptomes: "Courroie qui se delite dans l'huile, depots obstruant la crepine, casse moteur possible."
  verifier: "Courroie remplacee (facture) ou moteur post-2022, niveau et proprete de l'huile, bruit a froid."
  cout_eur: 1500
  severite: 5

- code: bmw_n47_chaine
  makes: [BMW]
  keywords: ["n47", "116d", "118d", "120d", "316d", "318d", "320d", "520d", "x1 18d", "x3 18d"]
  years: [2007, 2011]
  titre: "Diesel N47 - chaine de distribution cote volant moteur"
  symptomes: "Cliquetis a froid, allongement de chaine, depose moteur necessaire pour la reparation."
  verifier: "Bruit de chaine au demarrage a froid, facture de remplacement, historique constructeur."
  cout_eur: 2500
  severite: 5

- code: vw_dsg_dq200
  makes: [Volkswagen, Audi, Seat, Skoda, Cupra]
