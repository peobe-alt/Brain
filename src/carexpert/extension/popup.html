<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>CarExpert</title>
  <style>
    :root { color-scheme: dark; }
    body {
      width: 288px; margin: 0; padding: 14px;
      background: #0b0c0f; color: #e8eaf0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 13px; line-height: 1.5;
    }
    h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: -0.01em; }
    p.sub { margin: 0 0 12px; color: #8b91a3; font-size: 12px; }
    .state { display: flex; align-items: center; gap: 8px; padding: 9px 11px;
             background: #14161c; border: 1px solid #252936; border-radius: 10px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #8b91a3; flex: 0 0 auto; }
    .dot.on { background: #3ddc97; }
    .dot.off { background: #ff5c5c; }
    label { display: block; margin: 12px 0 4px; color: #8b91a3; font-size: 11px;
            text-transform: uppercase; letter-spacing: 0.07em; }
    input[type="text"] { width: 100%; padding: 7px 9px; background: #1a1d26; color: #e8eaf0;
                         border: 1px solid #252936; border-radius: 8px; font-size: 13px;
                         font-family: inherit; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .row label { margin: 0; text-transform: none; letter-spacing: normal;
                 font-size: 13px; color: #e8eaf0; }
    .buttons { display: flex; gap: 8px; margin-top: 14px; }
    button, a.button {
      flex: 1; padding: 8px 10px; background: #1a1d26; color: #e8eaf0;
      border: 1px solid #252936; border-radius: 9px; font-size: 13px; font-family: inherit;
      text-align: center; text-decoration: none; cursor: pointer;
    }
    a.primary { border-color: #6c8cff; }
    .found { margin-top: 12px; color: #8b91a3; font-size: 12px; }
  </style>
</head>
<body>
  <h1>CarExpert</h1>
  <p class="sub">Le verdict s'affiche sur les annonces du site.</p>

  <div class="state">
    <span class="dot" id="dot"></span>
    <span id="state">Verification...</span>
  </div>

  <label for="server">Adresse de CarExpert</label>
  <input type="text" id="server" spellcheck="false" autocomplete="off">

  <div class="row">
    <input type="checkbox" id="auto">
    <label for="auto">Analyser automatiquement chaque page</label>
  </div>

  <div class="buttons">
    <button id="analyse">Analyser la page</button>
    <a class="button primary" id="dashboard" href="#" target="_blank">Tableau de bord</a>
  </div>

  <p class="found" id="found"></p>

  <script src="popup.js"></script>
</body>
</html>
