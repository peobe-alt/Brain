# AutoScout24 - le plus gros inventaire pan-europeen, donc la source n°1
# pour comparer un meme modele entre pays.
name: autoscout24
label: AutoScout24
countries: [DE, FR, IT, ES, NL, BE, AT, LU, PL]
default_country: FR
base_url: https://www.autoscout24.fr

# Les gabarits d'URL ci-dessous suivent la structure publique du site mais
# DOIVENT etre revalides avant toute collecte reelle (voir docs/02-sources-et-legal.md).
# La voie fiable au quotidien: construire la recherche dans l'interface du site
# puis la passer telle quelle a `carexpert scan --url "<url collee>"`.
# Forme de recherche relevee sur le site:
#   /lst/<marque>/<modele>?sort=standard&desc=0&ustate=N,U&cy=F
#                          &damaged_listing=exclude&atype=C
# Confirmes: le chemin marque/modele, atype (C = voiture), ustate (N neuf,
# U occasion), cy (pays, avec un code maison), damaged_listing.
# Confirmes depuis, sur des URL relevees dans le navigateur:
#   - la pagination est `&page=N` (page 2 collee depuis le site);
#   - les codes pays maison (cy=F) et la forme marque/modele.
# Encore a confirmer: les bornes de prix, de kilometrage et d'annee
# (pricefrom, priceto, kmto, fregfrom), qui ne servent que si l'utilisateur
# demande ces filtres. La voie sure reste de coller son URL.
verified: true
search_url: "https://www.autoscout24.fr/lst/{make}/{model}?atype=C&ustate=N%2CU&cy={country}&damaged_listing=exclude&sort=standard&desc=0&pricefrom={price_min}&priceto={price_max}&kmto={km_max}&fregfrom={year_min}&page={page}"

# AutoScout24 n'utilise pas les codes ISO pour les pays.
country_codes:
  FR: F
  DE: D
  IT: I
  ES: E
  BE: B
  AT: A
  LU: L
  NL: NL
  PL: PL
# Forme reelle relevee sur des annonces du site:
#   /offres/<slug>-cat_ma<marque>mo<modele>-<uuid>
# L'UUID final est l'identifiant de l'annonce. L'exiger evite de collecter
# les pages de categorie qui vivent aussi sous /offres/.
listing_link_pattern: "/offres/[^/?#]+-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"

# VERIFIE sur une page de resultats reelle (Volvo V70, France, 14 annonces):
# les <a> de titre des annonces n'ont AUCUN attribut href, le site l'ajoute
# en JavaScript. Un collecteur qui suit les liens trouve donc zero annonce
# sur une page qui en affiche quatorze - et le dit sans erreur.
# Ce que la page publie en revanche: un JSON-LD
#   SearchResultsPage -> ItemList -> 14 ListItem
# avec, par annonce, l'URL, la marque, le modele, le kilometrage, le
# carburant, la boite, les photos, le prix et le vendeur; et une carte
# <article id="<uuid>" data-first-registration data-listing-zip-code ...>
# qui complete la date de mise en circulation et le code postal.
# D'ou: on lit la page de resultats, on n'ouvre pas les 14 annonces.
#
# Confirme sur une deuxieme page (Volkswagen Golf, 1 849 annonces, 93 pages),
# qui ajoute trois choses:
#   - le JSON-LD y est enveloppe dans un @graph;
#   - la puissance n'est dans aucun attribut, seulement dans le texte de la
#     carte ("235 kW (320 Ch)");
#   - une annonce dont le prix vient de baisser affiche son ancien prix.
# La pagination, elle, est confirmee: les numeros de page sont des <button>
# et non des liens, mais cliquer sur "2" donne bien `&page=2`. Une URL collee
# est donc suivie de page en page, et non lue une seule fois.
results_page_listings: true

# Codes carburant releves dans la taxonomie que le site publie dans sa propre
# page: B essence, D diesel, E electrique, C GNV, H hydrogene, L GPL,
# M ethanol, 2 electrique/essence, 3 electrique/diesel. Utilises uniquement
# si le schema.org ne dit rien.

# 93 pages pour une seule recherche Volkswagen Golf en France. Le plafond
# reel est celui des reglages (max_pages_per_search), plus bas par defaut.
max_pages: 50
page_param: page
request_delay: 3.0
requires_js: false

# Filets de securite si le schema.org venait a manquer. Laisses vides
# volontairement: un selecteur invente vaut moins que pas de selecteur.
selectors: {}

notes: >
  Publie du JSON-LD schema.org/Car sur les pages d'annonce, ce qui rend
  l'extraction stable. Verifier les conditions d'utilisation et privilegier
  un acces API/partenaire pour tout usage au dela de la veille personnelle.
