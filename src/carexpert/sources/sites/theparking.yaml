# TheParking - agregateur pan-europeen: il republie les annonces d'autres
# sites. Utile pour balayer large d'un coup, a manier avec prudence car la
# meme voiture y apparait sous plusieurs sources (voir invariant 4:
# deduplication par vehicule).
name: theparking
label: TheParking
countries: [FR, DE, IT, ES, NL, BE]
default_country: FR
base_url: https://www.theparking.eu
verified: false

# PAS DE `search_url` ICI, ET C'EST VOLONTAIRE.
#
# La recherche du site vit derriere un routage `#!`. Forme relevee, collee
# depuis la barre d'adresse:
#
#   https://www.theparking.eu/#!/used-cars/V70.html?id_energie=1&id_motorisation=12
#
# Tout ce qui suit le `#` est un fragment: la norme (RFC 3986, section 3.5)
# veut qu'il ne soit jamais transmis au serveur. Le modele, l'energie et la
# motorisation restent donc dans le navigateur, et une requete HTTP sur cette
# URL ne demande que `https://www.theparking.eu/`, c'est-a-dire la page
# d'accueil.
#
# Mettre ce gabarit dans `search_url` ferait donc rejouer la page d'accueil a
# chaque page de chaque recherche, et rapporter "0 annonce" sans une seule
# erreur. Un champ absent est plus honnete qu'un champ qui ment: tant qu'une
# URL de recherche servie par le serveur n'a pas ete relevee, il n'y a rien a
# templater.
#
# Les pages d'ANNONCE, elles, sont servies par le serveur (voir ci-dessous):
# l'URL relevee ne porte pas de `#` et s'ouvre telle quelle. Reste a
# confirmer, sur une vraie reponse du site, qu'elles publient bien du
# schema.org/Car: c'est ce dont depend l'extraction, et ce n'a pas encore ete
# verifie faute d'avoir pu joindre le site.

# VERIFIE sur une annonce reelle du site:
#   /used-cars-detail/volvo-v70-d4
#                    /volvo-v70-2-0-d4-summum-leer-nette-auto-goed-onderhouden-apk
#                    /4V8NK9AT.html
#
# Trois choses s'y lisent:
#
# 1. L'identifiant d'annonce est le jeton final, `4V8NK9AT`: huit caracteres
#    alphanumeriques, pas un nombre. Le defaut generique du projet
#    (`/\d{5,}`) ne trouve donc RIEN sur ce site - mesure: 0 lien sur une
#    annonce bien reelle. Une source laissee sur le defaut aurait rapporte
#    zero annonce sans erreur.
# 2. Le segment `volvo-v70-d4` est le slug du MODELE, partage par toutes les
#    Volvo V70 D4 du site. Meme piege que `cat_ma73mo2079` sur AutoScout24
#    (invariant 9): le lire comme identifiant ferait s'ecraser toutes les V70
#    sur une seule ligne. On lit le dernier segment, jamais celui-la.
# 3. Le jeton porte des chiffres la ou les slugs n'en portent pas toujours:
#    c'est ce qui separe une annonce d'un `index.html` ou d'un `contact.html`
#    vivant sous le meme prefixe.
listing_link_pattern: "/used-cars-detail/(?:[^/?#]+/)+(?=[A-Za-z0-9]*\\d)[A-Za-z0-9]{6,}\\.html"

max_pages: 2
request_delay: 4.0
requires_js: true
selectors: {}

notes: >
  Agregateur: la meme voiture y apparait souvent plusieurs fois, via
  plusieurs sites d'origine. Les pages d'annonce sont servies par le serveur
  (`/used-cars-detail/.../<ID>.html`); leur balisage reste a confirmer avec
  `carexpert analyse-url`. La recherche, elle, est rendue cote client
  derriere un routage `#!` et reste hors de portee en HTTP simple tant
  qu'une URL de recherche servie par le serveur n'a pas ete relevee. Le
  diagnostic propose les sitemaps du site pour la trouver:
  carexpert diagnose -s theparking --url "<URL collee>".
