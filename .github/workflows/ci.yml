name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,photos]"
      # Le linter tourne avant les tests: c'est lui qui a trouve un appel
      # a une fonction inexistante dans la passe profonde, qu'aucun test
      # n'atteignait.
      - run: ruff check src tests
      - run: pytest -q
